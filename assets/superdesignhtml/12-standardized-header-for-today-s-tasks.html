<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,600;9..144,0,700;9..144,1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-forest: #2E5D3A;
      --color-olive: #6B7A3F;
      --color-terracotta: #C06B3A;
      --color-honey: #E0A458;
      --color-brass: #B89968;
      --color-cream: #FAF7F1;
      --color-ink: #1E2A22;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-cream);
      color: var(--color-ink);
      line-height: 1.55;
    }

    .font-fraunces {
      font-family: 'Fraunces', serif;
      letter-spacing: -0.01em;
    }

    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .warm-shadow {
      box-shadow: 0 2px 4px rgba(46,45,33,0.06), 0 8px 16px rgba(46,45,33,0.06);
    }

    .app-bar {
      background-color: #6B7A3F;
      color: #FAF7F1;
      border-top: 0.5px solid #B89968;
      view-transition-name: app-bar;
    }

    .task-card {
      transition: transform 0.12s ease, opacity 0.25s ease, margin 0.25s ease;
      border-top: 0.5px solid var(--color-brass);
    }

    .task-card:active {
      transform: scale(0.97);
    }

    .task-removing {
      opacity: 0;
      transform: translateX(-100%);
      margin-top: -100px !important;
      pointer-events: none;
    }

    .checkbox-circle {
      width: 24px;
      height: 24px;
      border: 2px solid #7A7A7A;
      border-radius: 50%;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox-circle:hover {
      border-color: var(--color-forest);
    }

    .check-svg {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 0.3s ease-out;
    }

    .checked .check-svg {
      stroke-dashoffset: 0;
    }

    .checked .checkbox-circle {
      border-color: var(--color-forest);
      background-color: var(--color-forest);
    }

    .leaf-burst {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .leaf-particle {
      position: absolute;
      opacity: 0;
      transform: translateY(0) rotate(0deg);
    }

    .bursting .leaf-particle {
      animation: leaf-fly 0.6s ease-out forwards;
    }

    @keyframes leaf-fly {
      0% { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-40px) translateX(var(--x)) rotate(var(--r)); }
    }


  </style>
  <style>sd-component { display: block; }</style>
  <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
</head>
<body class="antialiased">
  <div class="paper-grain"></div>

  <div class="w-full h-screen flex flex-col relative">
    
    <!-- App Bar -->
    <header class="sticky top-0 shrink-0 pt-14 app-bar z-50">
      <div class="h-14 px-4 flex items-center justify-between">
        <div class="w-10 flex items-center">
          <a href="#" id="header-back-link" class="w-10 h-10 -ml-2 flex items-center justify-center text-[#FAF7F1] md:hidden">
            <iconify-icon icon="lucide:chevron-left" class="text-2xl"></iconify-icon>
          </a>
        </div> <!-- Left spacer for centering -->
        <h1 class="font-fraunces text-[20px] font-semibold text-[#FAF7F1] tracking-tight flex-1 text-center">Today's Tasks</h1>
        <div class="flex items-center gap-4 w-10 justify-end">
          <button id="header-search-btn" class="p-1 active:scale-90 transition-transform text-[#FAF7F1]">
            <iconify-icon icon="lucide:search" class="text-2xl"></iconify-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-6 pb-40">
      <div class="mb-6">
        <h2 class="font-fraunces text-[28px] text-[#6B7A3F] font-bold tracking-tight">Today</h2>
        <p class="text-sm italic font-fraunces text-[#B89968]">April, Autumn in Papamoa</p>
      </div>

      <div class="space-y-4" id="task-list">
        <!-- Task 1 -->
        <div class="task-card bg-white rounded-[22px] p-4 flex items-center gap-4 warm-shadow relative overflow-hidden" onclick="markDone(this)">
          <div class="leaf-burst">
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: -20px; --r: -45deg; left: 10px; top: 10px;"></iconify-icon>
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: 20px; --r: 45deg; right: 10px; top: 10px;"></iconify-icon>
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: -10px; --r: -20deg; left: 40px; top: 5px;"></iconify-icon>
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: 10px; --r: 20deg; right: 40px; top: 5px;"></iconify-icon>
          </div>
          <div class="checkbox-wrapper">
            <div class="checkbox-circle">
              <svg class="check-svg" width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1.5 5 4.5 8 10.5 2" />
              </svg>
            </div>
          </div>
          <div class="flex-1">
            <h3 class="text-base font-semibold text-[#1E2A22] leading-tight">Transplant 4 tomato seedlings</h3>
            <p class="text-sm text-[#7A7A7A] mt-0.5">Greenhouse Bay 1</p>
          </div>
        </div>

        <!-- Task 2 -->
        <div class="task-card bg-white rounded-[22px] p-4 flex items-center gap-4 warm-shadow relative overflow-hidden" onclick="markDone(this)">
          <div class="leaf-burst">
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: -15px; --r: -30deg; left: 15px; top: 15px;"></iconify-icon>
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: 15px; --r: 30deg; right: 15px; top: 15px;"></iconify-icon>
          </div>
          <div class="checkbox-wrapper">
            <div class="checkbox-circle">
              <svg class="check-svg" width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1.5 5 4.5 8 10.5 2" />
              </svg>
            </div>
          </div>
          <div class="flex-1">
            <h3 class="text-base font-semibold text-[#1E2A22] leading-tight">Check whitefly traps in Bay 1</h3>
            <p class="text-sm text-[#7A7A7A] mt-0.5">Outside monitoring</p>
          </div>
        </div>

        <!-- Task 3 -->
        <div class="task-card bg-white rounded-[22px] p-4 flex items-center gap-4 warm-shadow relative overflow-hidden" onclick="markDone(this)">
          <div class="leaf-burst">
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: -15px; --r: -30deg; left: 15px; top: 15px;"></iconify-icon>
            <iconify-icon icon="lucide:leaf" class="leaf-particle text-[#4E8C52]" style="--x: 15px; --r: 30deg; right: 15px; top: 15px;"></iconify-icon>
          </div>
          <div class="checkbox-wrapper">
            <div class="checkbox-circle">
              <svg class="check-svg" width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1.5 5 4.5 8 10.5 2" />
              </svg>
            </div>
          </div>
          <div class="flex-1">
            <h3 class="text-base font-semibold text-[#1E2A22] leading-tight">Water potted citrus</h3>
            <p class="text-sm text-[#7A7A7A] mt-0.5">Shade house</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <!-- component: BottomNavigation (cd8c80f5-74cc-4601-89c1-0e037aa5e3af) -->
<div v-scope="{ ...{&quot;activeItem&quot;:&quot;home&quot;,&quot;homeHref&quot;:&quot;#home&quot;,&quot;cropsHref&quot;:&quot;#crops&quot;,&quot;calendarHref&quot;:&quot;#calendar&quot;,&quot;pestsHref&quot;:&quot;#pests&quot;,&quot;settingsHref&quot;:&quot;#settings&quot;}, $emit() {} }">
<footer class="fixed bottom-0 left-0 right-0 bg-white border-t-[0.5px] border-[#B89968]/30 px-2 pb-[34px] pt-3 z-50" style="box-shadow: 0 2px 4px rgba(46,45,33,0.03), 0 8px 16px rgba(46,45,33,0.06)"><nav class="flex justify-between items-center max-w-md mx-auto"><a :href="homeHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:home" class="text-[18px]" :class="activeItem === 'home' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'home' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Home</span><div v-if="activeItem === 'home'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="cropsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:sprout" class="text-[18px]" :class="activeItem === 'crops' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'crops' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Crops</span><div v-if="activeItem === 'crops'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="calendarHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:calendar" class="text-[18px]" :class="activeItem === 'calendar' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'calendar' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Calendar</span><div v-if="activeItem === 'calendar'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="pestsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:bug" class="text-[18px]" :class="activeItem === 'pests' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'pests' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Pests</span><div v-if="activeItem === 'pests'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="settingsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:settings" class="text-[18px]" :class="activeItem === 'settings' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'settings' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Settings</span><div v-if="activeItem === 'settings'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a></nav></footer>
</div>
<!-- /component: BottomNavigation (cd8c80f5-74cc-4601-89c1-0e037aa5e3af) -->
  </div>

  <script>
    function markDone(element) {
      if (element.classList.contains('checked')) return;

      // 1. Toggle checked state and burst leaves
      element.classList.add('checked', 'bursting');
      
      // 2. Delay for the leaf animation and checkmark animation
      setTimeout(() => {
        // 3. Slide out task
        element.classList.add('task-removing');
        
        // 4. Optionally remove from DOM after slide completion
        setTimeout(() => {
          element.style.display = 'none';
        }, 250);
      }, 700);
    }
  </script>
</body>
</html>
