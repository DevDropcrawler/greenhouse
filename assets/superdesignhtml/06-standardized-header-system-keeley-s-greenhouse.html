<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,600;9..144,0,700;9..144,1,600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @view-transition {
      navigation: auto;
    }
    :root {
      --color-forest: #2E5D3A;
      --color-olive: #6B7A3F; /* Standard Olive Moss */
      --color-terracotta: #C06B3A;
      --color-honey: #E0A458;
      --color-brass: #B89968;
      --color-cream: #FAF7F1;
      --color-dark: #1E2A22;
      --color-sprout: #4E8C52;
      --shadow-warm: 0 2px 4px rgba(46,45,33,0.06), 0 8px 16px rgba(46,45,33,0.06);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }
    .font-fraunces {
      font-family: 'Fraunces', serif;
      letter-spacing: -0.01em;
    }
    .paper-grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 60;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    .app-bar {
      background-color: #6B7A3F;
      color: #FAF7F1;
      border-top: 0.5px solid #B89968;
      view-transition-name: app-bar;
    }
    .bottom-nav {
      background-color: var(--color-cream); /* Opaque background as per design rules */
      border-top: 0.5px solid var(--color-brass);
      view-transition-name: bottom-nav;
    }
    .active-nav-underline {
      background-color: var(--color-brass);
      width: 20px;
      height: 2px;
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 1px;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-[#FAF7F1] text-[#1E2A22] flex flex-col relative overflow-x-hidden">
    <div class="paper-grain"></div>
    
    <!-- App Bar -->
    <header class="sticky top-0 shrink-0 pt-14 app-bar z-50">
      <div class="h-14 px-4 flex items-center justify-between">
        <div class="w-10"></div> <!-- Left spacer for centering -->
        <h1 class="font-fraunces text-[20px] font-semibold text-[#FAF7F1] tracking-tight flex-1 text-center">Crops</h1>
        <div class="flex items-center gap-4 w-10 justify-end">
          <button id="header-search-btn" class="p-1 active:scale-90 transition-transform">
            <iconify-icon icon="lucide:search" class="text-2xl"></iconify-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-32">
      <!-- Filter Section -->
      <section class="pt-4">
        <div class="flex overflow-x-auto gap-2 px-4 pb-4 scrollbar-hide">
          <button id="filter-all" class="px-5 py-2 rounded-full bg-[#2E5D3A] text-[#FAF7F1] font-fraunces font-semibold text-xs whitespace-nowrap active:scale-95 transition-transform">
            All
          </button>
          <button id="filter-veg" class="px-5 py-2 rounded-full bg-[#FAF7F1] text-[#1E2A22] border-[0.5px] border-[#B89968] font-fraunces font-semibold text-xs whitespace-nowrap active:scale-95 transition-transform">
            Vegetables
          </button>
          <button id="filter-fruit" class="px-5 py-2 rounded-full bg-[#FAF7F1] text-[#1E2A22] border-[0.5px] border-[#B89968] font-fraunces font-semibold text-xs whitespace-nowrap active:scale-95 transition-transform">
            Fruit Trees
          </button>
          <button id="filter-herbs" class="px-5 py-2 rounded-full bg-[#FAF7F1] text-[#1E2A22] border-[0.5px] border-[#B89968] font-fraunces font-semibold text-xs whitespace-nowrap active:scale-95 transition-transform">
            Herbs
          </button>
        </div>
      </section>

      <!-- Crops Grid -->
      <section class="px-4 grid grid-cols-2 gap-4">
        <a href="#" id="crop-tomato-link" class="group bg-white rounded-[22px] overflow-hidden border-[0.5px] border-transparent hover:border-[#B89968]/30 transition-all shadow-sm">
          <div class="h-40 w-full relative border-t-[0.5px] border-[#B89968]">
            <img src="https://images.unsplash.com/photo-1592841200221-a6898f307baa?auto=format&fit=crop&q=80&w=400" alt="Tomato" class="w-full h-full object-cover rounded-t-[24px]">
            <div class="absolute top-3 right-3">
              <span class="px-2 py-0.5 bg-[#2E5D3A] text-white text-[9px] font-bold uppercase tracking-widest rounded-full">Growing</span>
            </div>
          </div>
          <div class="p-3">
            <h3 class="font-fraunces font-semibold text-[15px] leading-tight mb-2 tracking-tight">Tomato 'Money Maker'</h3>
            <div class="space-y-1.5">
              <div class="h-1.5 w-full bg-[#FAF7F1] rounded-full overflow-hidden">
                <div class="h-full bg-[#2E5D3A] rounded-full" style="width: 65%"></div>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-[10px] uppercase font-bold text-[#B89968] tabular-nums tracking-wide">28/90 Days</span>
                <iconify-icon icon="lucide:thermometer" class="text-xs text-[#B89968]"></iconify-icon>
              </div>
            </div>
          </div>
        </a>

        <a href="#" id="crop-cucumber-link" class="group bg-white rounded-[22px] overflow-hidden border-[0.5px] border-transparent hover:border-[#B89968]/30 transition-all shadow-sm">
          <div class="h-40 w-full relative border-t-[0.5px] border-[#B89968]">
            <img src="https://images.unsplash.com/photo-1449339854873-750e6df51301?auto=format&fit=crop&q=80&w=400" alt="Cucumber" class="w-full h-full object-cover rounded-t-[24px]">
            <div class="absolute top-3 right-3">
              <span class="px-2 py-0.5 bg-[#C06B3A] text-white text-[9px] font-bold uppercase tracking-widest rounded-full">Seedling</span>
            </div>
          </div>
          <div class="p-3">
            <h3 class="font-fraunces font-semibold text-[15px] leading-tight mb-2 tracking-tight">Cucumber 'Lebanese'</h3>
            <div class="space-y-1.5">
              <div class="h-1.5 w-full bg-[#FAF7F1] rounded-full overflow-hidden">
                <div class="h-full bg-[#C06B3A] rounded-full" style="width: 35%"></div>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-[10px] uppercase font-bold text-[#B89968] tabular-nums tracking-wide">12/45 Days</span>
                <iconify-icon icon="lucide:droplet" class="text-xs text-[#B89968]"></iconify-icon>
              </div>
            </div>
          </div>
        </a>

        <a href="#" id="crop-basil-link" class="group bg-white rounded-[22px] overflow-hidden border-[0.5px] border-transparent hover:border-[#B89968]/30 transition-all shadow-sm">
          <div class="h-40 w-full relative border-t-[0.5px] border-[#B89968]">
            <img src="https://images.unsplash.com/photo-1618375531912-867984d28994?auto=format&fit=crop&q=80&w=400" alt="Basil" class="w-full h-full object-cover rounded-t-[24px]">
            <div class="absolute top-3 right-3">
              <span class="px-2 py-0.5 bg-[#4E8C52] text-white text-[9px] font-bold uppercase tracking-widest rounded-full">Harvest</span>
            </div>
          </div>
          <div class="p-3">
            <h3 class="font-fraunces font-semibold text-[15px] leading-tight mb-2 tracking-tight">Basil 'Genovese'</h3>
            <div class="space-y-1.5">
              <div class="h-1.5 w-full bg-[#FAF7F1] rounded-full overflow-hidden">
                <div class="h-full bg-[#4E8C52] rounded-full" style="width: 95%"></div>
              </div>
              <p class="text-[10px] uppercase font-bold text-[#4E8C52] tracking-wide">Ready to harvest</p>
            </div>
          </div>
        </a>

        <a href="#" id="crop-lemon-link" class="group bg-white rounded-[22px] overflow-hidden border-[0.5px] border-transparent hover:border-[#B89968]/30 transition-all shadow-sm">
          <div class="h-40 w-full relative border-t-[0.5px] border-[#B89968]">
            <img src="https://images.unsplash.com/photo-1621252329302-3151859c22a1?auto=format&fit=crop&q=80&w=400" alt="Lemon" class="w-full h-full object-cover rounded-t-[24px]">
            <div class="absolute top-3 right-3">
              <span class="px-2 py-0.5 bg-[#2E5D3A] text-white text-[9px] font-bold uppercase tracking-widest rounded-full">Growing</span>
            </div>
          </div>
          <div class="p-3">
            <h3 class="font-fraunces font-semibold text-[15px] leading-tight mb-2 tracking-tight">Meyer Lemon Tree</h3>
            <div class="space-y-1.5">
              <div class="h-1.5 w-full bg-[#FAF7F1] rounded-full overflow-hidden">
                <div class="h-full bg-[#2E5D3A] rounded-full" style="width: 70%"></div>
              </div>
              <p class="text-[10px] uppercase font-bold text-[#B89968] tabular-nums tracking-wide">2.5/5 Years</p>
            </div>
          </div>
        </a>
      </section>

      <!-- FAB -->
      <button id="add-planting-fab" class="fixed bottom-24 right-6 w-14 h-14 bg-[#2E5D3A] text-[#FAF7F1] rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform z-30">
        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
      </button>
    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 h-[72px] bottom-nav flex items-center justify-between px-8 z-50">
      <a href="#" id="nav-home-link" class="flex flex-col items-center gap-1 text-[#1E2A22]/40 hover:text-[#1E2A22] transition-colors">
        <iconify-icon icon="lucide:home" class="text-xl"></iconify-icon>
        <span class="font-semibold text-[10px] uppercase tracking-wider">Home</span>
      </a>
      <a href="#" id="nav-calendar-link" class="flex flex-col items-center gap-1 text-[#1E2A22]/40 hover:text-[#1E2A22] transition-colors">
        <iconify-icon icon="lucide:calendar" class="text-xl"></iconify-icon>
        <span class="font-semibold text-[10px] uppercase tracking-wider">Calendar</span>
      </a>
      <a href="#" id="nav-crops-link" class="flex flex-col items-center gap-1 text-[#2E5D3A] relative">
        <iconify-icon icon="lucide:sprout" class="text-xl"></iconify-icon>
        <span class="font-semibold text-[10px] uppercase tracking-wider">Crops</span>
        <div class="active-nav-underline"></div>
      </a>
      <a href="#" id="nav-garden-link" class="flex flex-col items-center gap-1 text-[#1E2A22]/40 hover:text-[#1E2A22] transition-colors">
        <iconify-icon icon="lucide:droplets" class="text-xl"></iconify-icon>
        <span class="font-semibold text-[10px] uppercase tracking-wider">Garden</span>
      </a>
      <a href="#" id="nav-more-link" class="flex flex-col items-center gap-1 text-[#1E2A22]/40 hover:text-[#1E2A22] transition-colors">
        <iconify-icon icon="lucide:more-horizontal" class="text-xl"></iconify-icon>
        <span class="font-semibold text-[10px] uppercase tracking-wider">More</span>
      </a>
    </nav>
  </div>
</body>
</html>
