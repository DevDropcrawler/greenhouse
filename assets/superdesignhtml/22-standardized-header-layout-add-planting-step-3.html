<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-forest: #2E5D3A;
      --color-olive: #6B7A3F;
      --color-brass: #B89968;
      --color-cream: #FAF7F1;
      --color-ink: #1E2A22;
      --shadow-warm: 0 2px 4px rgba(46, 45, 33, 0.03), 0 8px 16px rgba(46, 45, 33, 0.06);
    }
    
    .font-fraunces { font-family: 'Fraunces', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-inter-tabular { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }

    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .warm-shadow {
      box-shadow: var(--shadow-warm);
    }

    .app-bar {
      background-color: #6B7A3F;
      color: #FAF7F1;
      border-top: 0.5px solid #B89968;
      view-transition-name: app-bar;
    }

    .zone-card-active {
      border: 2px solid var(--color-forest);
    }

    .zone-card-inactive {
      border: 0.5px solid var(--color-brass);
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
  <style>sd-component { display: block; }</style>
  <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative bg-[#FAF7F1]">
    <div class="paper-grain"></div>
    
    <!-- App Bar -->
    <header class="sticky top-0 shrink-0 pt-14 app-bar z-50">
      <div class="h-14 px-4 flex items-center justify-between">
        <div class="w-10 flex items-center">
          <a href="#" id="header-back-link" class="flex items-center active:scale-95 transition-transform">
            <iconify-icon icon="lucide:arrow-left" class="text-[#FAF7F1] text-2xl"></iconify-icon>
          </a>
        </div>
        <h1 class="font-fraunces text-[20px] font-semibold text-[#FAF7F1] tracking-tight flex-1 text-center">Select location in garden</h1>
        <div class="w-10 flex items-center justify-end">
          <div class="font-fraunces text-[13px] font-bold text-[#FAF7F1] opacity-60 uppercase tracking-widest">3/4</div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-8 pb-32 scrollbar-hide relative z-0">
      <!-- Header Section -->
      <div class="mb-8">
        <h2 class="font-fraunces text-[28px] text-[#6B7A3F] font-bold leading-tight tracking-tight mb-2">Select location in garden</h2>
        <p class="font-inter text-base text-[#1E2A22]/70">Choose a spot for your tomato</p>
      </div>

      <!-- Garden Grid (2x2) -->
      <div class="grid grid-cols-2 gap-4">
        
        <!-- Zone A (Selected) -->
        <div class="bg-white rounded-[22px] p-5 flex flex-col items-center warm-shadow zone-card-active active:scale-[0.98] transition-transform cursor-pointer">
          <span class="font-fraunces text-[36px] font-bold text-[#B89968] mb-1">A</span>
          <span class="font-inter font-semibold text-sm text-[#1E2A22] mb-4">Zone Alpha</span>
          
          <!-- Mini Grid Slots -->
          <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
          </div>

          <span class="font-inter-tabular text-[11px] font-bold text-[#B89968] uppercase tracking-wider">2/4 spots available</span>
        </div>

        <!-- Zone B -->
        <div class="bg-white rounded-[22px] p-5 flex flex-col items-center warm-shadow zone-card-inactive active:scale-[0.98] transition-transform cursor-pointer">
          <span class="font-fraunces text-[36px] font-bold text-[#B89968] mb-1">B</span>
          <span class="font-inter font-semibold text-sm text-[#1E2A22] mb-4">Zone Bravo</span>
          
          <!-- Mini Grid Slots -->
          <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
          </div>

          <span class="font-inter-tabular text-[11px] font-bold text-[#B89968] uppercase tracking-wider">1/4 spots available</span>
        </div>

        <!-- Zone C -->
        <div class="bg-white rounded-[22px] p-5 flex flex-col items-center warm-shadow zone-card-inactive active:scale-[0.98] transition-transform cursor-pointer">
          <span class="font-fraunces text-[36px] font-bold text-[#B89968] mb-1">C</span>
          <span class="font-inter font-semibold text-sm text-[#1E2A22] mb-4">Zone Charlie</span>
          
          <!-- Mini Grid Slots -->
          <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
          </div>

          <span class="font-inter-tabular text-[11px] font-bold text-[#B89968] uppercase tracking-wider">4/4 spots available</span>
        </div>

        <!-- Zone D -->
        <div class="bg-white rounded-[22px] p-5 flex flex-col items-center warm-shadow zone-card-inactive active:scale-[0.98] transition-transform cursor-pointer">
          <span class="font-fraunces text-[36px] font-bold text-[#B89968] mb-1">D</span>
          <span class="font-inter font-semibold text-sm text-[#1E2A22] mb-4">Zone Delta</span>
          
          <!-- Mini Grid Slots -->
          <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full bg-[#E8E5D7] flex items-center justify-center">
              <iconify-icon icon="lucide:leaf" class="text-[#2E5D3A] text-lg"></iconify-icon>
            </div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
            <div class="w-8 h-8 rounded-full border-[1.5px] border-[#B89968]/30"></div>
          </div>

          <span class="font-inter-tabular text-[11px] font-bold text-[#B89968] uppercase tracking-wider">2/4 spots available</span>
        </div>

      </div>
    </main>

    <!-- Wizard Action Footer (Opaque background as per rules) -->
    <footer class="shrink-0 pb-6 px-6 pt-4 bg-white border-t-[0.5px] border-[#B89968] z-30">
      <div class="flex items-center gap-4">
        <a href="#" id="btn-back" class="flex-1 h-12 flex items-center justify-center border-2 border-[#2E5D3A] text-[#2E5D3A] rounded-full font-fraunces font-semibold active:scale-95 transition-transform">
          Back
        </a>
        <a href="#" id="btn-next" class="flex-[1.5] h-12 flex items-center justify-center bg-[#2E5D3A] text-[#FAF7F1] rounded-full font-fraunces font-semibold warm-shadow active:scale-95 transition-transform">
          Next Step
        </a>
      </div>
    </footer>

    <!-- Spacer for persistent BottomNavigation (which is fixed at bottom) -->
    <div class="h-[84px] shrink-0"></div>

    <!-- Standard Bottom Navigation (Visible as requested for all views) -->
    <!-- component: BottomNavigation (cd8c80f5-74cc-4601-89c1-0e037aa5e3af) -->
<div v-scope="{ ...{&quot;activeItem&quot;:&quot;crops&quot;,&quot;homeHref&quot;:&quot;#home&quot;,&quot;cropsHref&quot;:&quot;#crops&quot;,&quot;calendarHref&quot;:&quot;#calendar&quot;,&quot;pestsHref&quot;:&quot;#pests&quot;,&quot;settingsHref&quot;:&quot;#settings&quot;}, $emit() {} }">
<footer class="fixed bottom-0 left-0 right-0 bg-white border-t-[0.5px] border-[#B89968]/30 px-2 pb-[34px] pt-3 z-50" style="box-shadow: 0 2px 4px rgba(46,45,33,0.03), 0 8px 16px rgba(46,45,33,0.06)"><nav class="flex justify-between items-center max-w-md mx-auto"><a :href="homeHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:home" class="text-[18px]" :class="activeItem === 'home' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'home' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Home</span><div v-if="activeItem === 'home'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="cropsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:sprout" class="text-[18px]" :class="activeItem === 'crops' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'crops' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Crops</span><div v-if="activeItem === 'crops'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="calendarHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:calendar" class="text-[18px]" :class="activeItem === 'calendar' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'calendar' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Calendar</span><div v-if="activeItem === 'calendar'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="pestsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:bug" class="text-[18px]" :class="activeItem === 'pests' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'pests' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Pests</span><div v-if="activeItem === 'pests'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="settingsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:settings" class="text-[18px]" :class="activeItem === 'settings' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'settings' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Settings</span><div v-if="activeItem === 'settings'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a></nav></footer>
</div>
<!-- /component: BottomNavigation (cd8c80f5-74cc-4601-89c1-0e037aa5e3af) -->

  </div>
</body>
</html>
