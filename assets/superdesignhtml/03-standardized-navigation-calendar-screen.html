<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FAF7F1;
      color: #1E2A22;
    }
    .font-fraunces {
      font-family: 'Fraunces', serif;
    }
    .paper-grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 60;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    .warm-shadow {
      box-shadow: 0 2px 4px rgba(46,45,33,0.03), 0 8px 16px rgba(46,45,33,0.06);
    }
    .brass-hairline-bottom {
      border-bottom-width: 0.5px;
      border-color: #B89968;
    }
    .brass-hairline-top {
      border-top-width: 0.5px;
      border-color: #B89968;
    }
    .active-underline {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background-color: #B89968;
      border-radius: 99px;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .app-bar {
      background-color: var(--olive-moss);
      color: var(--cream);
      border-top: 0.5px solid var(--brass);
      view-transition-name: app-bar;
    }
    .card-press:active {
      transform: scale(0.97);
      transition: transform 120ms ease;
    }
  </style>
</head>
<body class="antialiased">
  <div class="paper-grain"></div>

  <div class="w-full h-screen flex flex-col relative overflow-hidden">
    
    <!-- App Bar -->
    <header class="sticky top-0 shrink-0 pt-[14px] app-bar z-50">
      <div class="h-14 px-4 flex items-center justify-between">
        <div class="w-10"></div> <!-- Left spacer for centering -->
        <h1 class="font-fraunces text-[20px] font-semibold text-[#FAF7F1] tracking-tight flex-1 text-center">Calendar</h1>
        <div class="flex items-center gap-4 w-10 justify-end">
          <button id="header-search-btn" class="p-1 active:scale-90 transition-transform text-[#FAF7F1]">
            <iconify-icon icon="lucide:search" class="text-2xl"></iconify-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-[#FAF7F1] px-6 pb-40">
      
      <!-- Greetings Area -->
      <div class="py-6">
        <p class="text-[#1E2A22]/60 text-sm font-medium">Good morning</p>
        <h2 class="font-fraunces italic text-3xl text-[#4A5630] mt-1">April 2024</h2>
      </div>

      <!-- Botanical Divider -->
      <div class="w-full h-[1px] bg-[#B89968]/30 mb-8"></div>

      <!-- Eyebrow Section -->
      <div class="flex items-center gap-2 mb-6">
        <iconify-icon icon="lucide:leaf" class="text-[#B89968] text-xs"></iconify-icon>
        <span class="font-fraunces text-[11px] font-bold text-[#B89968] uppercase tracking-[0.1em]">Annual Overview</span>
      </div>

      <!-- 12-Month Grid -->
      <div class="grid grid-cols-3 gap-3">
        
        <!-- Card Helper: Month Card Template -->
        <div class="month-grid grid grid-cols-1 gap-4">
          <!-- Generating month entries via grid-cols-1 won't work easily here, manually doing for structure -->
        </div>

        <!-- Jan -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Jan</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#E0A458]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4A90E2]"></div>
          </div>
        </div>

        <!-- Feb -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Feb</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#2E5D3A]"></div>
          </div>
        </div>

        <!-- Mar -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Mar</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#2E5D3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#E0A458]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4A90E2]"></div>
          </div>
        </div>

        <!-- Apr (Current) -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-[#B89968] warm-shadow h-[100px] cursor-pointer relative">
          <div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-[#B89968] rounded-full border border-white"></div>
          <span class="font-fraunces font-bold text-[#4A5630] text-sm">Apr</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#2E5D3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#C06B3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4A90E2]"></div>
          </div>
        </div>

        <!-- May -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">May</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#C06B3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4A90E2]"></div>
          </div>
        </div>

        <!-- Jun -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Jun</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#4A90E2]"></div>
          </div>
        </div>

        <!-- Jul -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Jul</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#E0A458]"></div>
          </div>
        </div>

        <!-- Aug -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Aug</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#2E5D3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4E8C52]"></div>
          </div>
        </div>

        <!-- Sep -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Sep</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#2E5D3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#4A90E2]"></div>
          </div>
        </div>

        <!-- Oct -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Oct</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#C06B3A]"></div>
            <div class="w-1.5 h-1.5 rounded-full bg-[#E0A458]"></div>
          </div>
        </div>

        <!-- Nov -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Nov</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#2E5D3A]"></div>
          </div>
        </div>

        <!-- Dec -->
        <div class="card-press bg-white rounded-[22px] p-4 flex flex-col items-center justify-center border-[0.5px] border-transparent warm-shadow h-[100px] cursor-pointer">
          <span class="font-fraunces font-semibold text-[#1E2A22] text-sm">Dec</span>
          <div class="flex gap-1 mt-3">
            <div class="w-1.5 h-1.5 rounded-full bg-[#E0A458]"></div>
          </div>
        </div>

      </div>

      <!-- Activity Legend -->
      <div class="mt-10 bg-white rounded-[22px] p-6 warm-shadow">
        <h3 class="font-fraunces text-sm font-semibold text-[#1E2A22] mb-4">Key Activities</h3>
        <div class="grid grid-cols-2 gap-y-4">
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-[#2E5D3A]"></div>
            <span class="text-[12px] font-medium text-[#1E2A22]/70">Planting</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-[#C06B3A]"></div>
            <span class="text-[12px] font-medium text-[#1E2A22]/70">Harvest</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-[#4A90E2]"></div>
            <span class="text-[12px] font-medium text-[#1E2A22]/70">Care</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-[#E0A458]"></div>
            <span class="text-[12px] font-medium text-[#1E2A22]/70">Seeds</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <footer class="fixed bottom-0 left-0 right-0 h-[72px] bg-[#FAF7F1]/92 backdrop-blur-md border-t-[0.5px] border-[#B89968] z-50 pb-safe">
      <nav class="h-full flex items-center justify-between px-8 max-w-md mx-auto">
        <a href="#" id="nav-home-link" class="flex flex-col items-center justify-center gap-1 text-[#1E2A22] opacity-55 hover:opacity-100 transition-opacity">
          <iconify-icon icon="lucide:home" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-semibold uppercase tracking-wider">Home</span>
        </a>
        <a href="#" id="nav-calendar-link" class="flex flex-col items-center justify-center gap-1 text-[#2E5D3A] relative">
          <iconify-icon icon="lucide:calendar" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-semibold uppercase tracking-wider">Calendar</span>
          <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-6 h-[2px] bg-[#B89968] rounded-full"></div>
        </a>
        <a href="#" id="nav-crops-link" class="flex flex-col items-center justify-center gap-1 text-[#1E2A22] opacity-55 hover:opacity-100 transition-opacity">
          <iconify-icon icon="lucide:leaf" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-semibold uppercase tracking-wider">Crops</span>
        </a>
        <a href="#" id="nav-garden-link" class="flex flex-col items-center justify-center gap-1 text-[#1E2A22] opacity-55 hover:opacity-100 transition-opacity">
          <iconify-icon icon="lucide:layout-grid" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-semibold uppercase tracking-wider">Garden</span>
        </a>
        <a href="#" id="nav-more-link" class="flex flex-col items-center justify-center gap-1 text-[#1E2A22] opacity-55 hover:opacity-100 transition-opacity">
          <iconify-icon icon="lucide:more-vertical" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-semibold uppercase tracking-wider">More</span>
        </a>
      </nav>
    </footer>

  </div>
</body>
</html>
