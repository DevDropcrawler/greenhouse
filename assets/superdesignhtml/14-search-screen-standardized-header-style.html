<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #2E5D3A;
      --olive-moss: #6B7A3F;
      --terracotta: #C06B3A;
      --honey: #E0A458;
      --brass: #B89968;
      --cream: #FAF7F1;
      --dark-text: #1E2A22;
      --cream-text: #FAF7F1;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--cream);
      color: var(--dark-text);
      line-height: 1.55;
    }

    .font-fraunces {
      font-family: 'Fraunces', serif;
      letter-spacing: -0.01em;
    }

    .paper-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .custom-shadow {
      box-shadow: 0 2px 4px rgba(46,45,33,0.06), 0 8px 16px rgba(46,45,33,0.06);
    }

    .eyebrow-small-caps {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brass);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .search-input-focus:focus-within {
      transform: translateY(-2px);
      border-color: var(--brass);
      box-shadow: 0 0 0 1px var(--brass);
    }

    .chip-press:active {
      transform: scale(0.97);
    }

    .app-bar {
      background-color: #6B7A3F;
      color: #FAF7F1;
      border-top: 0.5px solid #B89968;
      view-transition-name: app-bar;
    }

    @view-transition {
      navigation: auto;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="paper-grain"></div>

  <div class="w-full h-screen flex flex-col relative bg-[#FAF7F1]">
    <!-- Sticky App Bar -->
    <header class="sticky top-0 shrink-0 pt-14 app-bar z-50">
      <div class="h-14 px-4 flex items-center justify-between">
        <div class="w-10 flex items-center">
          <a href="#" id="nav-back-link" class="flex items-center justify-center w-10 h-10 -ml-2 text-[#FAF7F1] active:opacity-70 transition-opacity">
            <iconify-icon icon="lucide:arrow-left" class="text-2xl"></iconify-icon>
          </a>
        </div>
        <h1 class="font-fraunces text-[20px] font-semibold text-[#FAF7F1] tracking-tight flex-1 text-center">Search</h1>
        <div class="flex items-center justify-end w-10">
          <button id="header-search-icon" class="p-1 active:scale-90 transition-transform text-[#FAF7F1]">
            <iconify-icon icon="lucide:search" class="text-2xl"></iconify-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pt-6 px-6 pb-[106px] relative">
      
      <!-- Search Field -->
      <div class="search-input-focus group flex items-center bg-[#FAF7F1] h-12 px-4 rounded-full border-[0.5px] border-[#B89968] transition-all duration-200">
        <iconify-icon icon="lucide:search" class="text-[#B89968] text-lg mr-3"></iconify-icon>
        <input 
          type="text" 
          placeholder="Search crops, pests, diseases..." 
          class="flex-1 bg-transparent border-none outline-none text-[15px] placeholder:text-[#1E2A22]/40 font-medium"
        >
        <iconify-icon icon="lucide:mic" class="text-[#B89968] text-lg ml-3"></iconify-icon>
      </div>

      <!-- Empty State Content -->
      <div class="flex-1 flex flex-col items-center justify-center pt-24 pb-16">
        <div class="relative mb-6">
          <iconify-icon icon="lucide:search" class="text-[48px] text-[#B89968]"></iconify-icon>
          <!-- Leaf Glyph Tail overlay -->
          <iconify-icon icon="lucide:leaf" class="absolute -bottom-1 -right-2 text-[24px] text-[#2E5D3A] rotate-[15deg]"></iconify-icon>
        </div>
        <h2 class="font-fraunces text-lg font-semibold text-[#4A5630] mb-2">No recent searches</h2>
        <p class="text-[14px] text-[#1E2A22] text-center opacity-80 max-w-[240px]">
          Try searching for a crop, pest, or disease to build your field journal.
        </p>
      </div>

      <!-- Divider -->
      <div class="h-[1px] w-full bg-[#B89968] opacity-20 mb-8"></div>

      <!-- Suggested Searches -->
      <section>
        <div class="eyebrow-small-caps mb-4">
          <iconify-icon icon="lucide:leaf" class="text-[12px]"></iconify-icon>
          Suggested
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <a href="#" id="suggested-tomato" class="chip-press flex items-center justify-center bg-[#FAF7F1] h-[36px] px-4 rounded-full border-[0.5px] border-[#B89968] custom-shadow transition-transform duration-100">
            <span class="text-[14px] font-semibold text-[#2E5D3A]">Tomato</span>
          </a>
          <a href="#" id="suggested-whitefly" class="chip-press flex items-center justify-center bg-[#FAF7F1] h-[36px] px-4 rounded-full border-[0.5px] border-[#B89968] custom-shadow transition-transform duration-100">
            <span class="text-[14px] font-semibold text-[#2E5D3A]">Whitefly</span>
          </a>
          <a href="#" id="suggested-basil" class="chip-press flex items-center justify-center bg-[#FAF7F1] h-[36px] px-4 rounded-full border-[0.5px] border-[#B89968] custom-shadow transition-transform duration-100">
            <span class="text-[14px] font-semibold text-[#2E5D3A]">Basil</span>
          </a>
          <a href="#" id="suggested-lemon" class="chip-press flex items-center justify-center bg-[#FAF7F1] h-[36px] px-4 rounded-full border-[0.5px] border-[#B89968] custom-shadow transition-transform duration-100">
            <span class="text-[14px] font-semibold text-[#2E5D3A]">Meyer Lemon</span>
          </a>
        </div>
      </section>

    </main>

    <!-- Empty Footer Area (Reserved for spacing/gestures) -->
    <nav class="fixed bottom-0 left-0 right-0 h-[72px] bg-[#FAF7F1] border-t-[0.5px] border-[#B8860B] flex justify-around items-center px-2 z-50">
      <a href="#" id="nav-home" class="flex flex-col items-center justify-center gap-1 flex-1 text-[#708249]">
        <iconify-icon icon="lucide:home" class="text-2xl"></iconify-icon>
        <span class="text-[12px] font-semibold">Home</span>
        <div class="w-5 h-[2px] bg-[#708249] rounded-full"></div>
      </a>
      <a href="#" id="nav-calendar" class="flex flex-col items-center justify-center gap-1 flex-1 text-[#1E2A22]/60">
        <iconify-icon icon="lucide:calendar" class="text-2xl"></iconify-icon>
        <span class="text-[12px] font-medium">Calendar</span>
        <div class="w-5 h-[2px] bg-transparent"></div>
      </a>
      <a href="#" id="nav-crops" class="flex flex-col items-center justify-center gap-1 flex-1 text-[#1E2A22]/60">
        <iconify-icon icon="lucide:sprout" class="text-2xl"></iconify-icon>
        <span class="text-[12px] font-medium">Crops</span>
        <div class="w-5 h-[2px] bg-transparent"></div>
      </a>
      <a href="#" id="nav-garden" class="flex flex-col items-center justify-center gap-1 flex-1 text-[#1E2A22]/60">
        <iconify-icon icon="lucide:flower-2" class="text-2xl"></iconify-icon>
        <span class="text-[12px] font-medium">Garden</span>
        <div class="w-5 h-[2px] bg-transparent"></div>
      </a>
      <a href="#" id="nav-more" class="flex flex-col items-center justify-center gap-1 flex-1 text-[#1E2A22]/60">
        <iconify-icon icon="lucide:more-horizontal" class="text-2xl"></iconify-icon>
        <span class="text-[12px] font-medium">More</span>
        <div class="w-5 h-[2px] bg-transparent"></div>
      </a>
    </nav>
  </div>
</body>
</html>
