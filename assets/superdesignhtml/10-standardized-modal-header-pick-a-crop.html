<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,600;9..144,0,700;9..144,1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-forest: #2E5D3A;
      --color-olive: #6B7A3F;
      --color-brass: #B89968;
      --color-terracotta: #C06B3A;
      --color-cream: #FAF7F1;
      --color-dark: #1E2A22;
    }
    
    .font-fraunces { font-family: 'Fraunces', serif; }
    .font-plus { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    .paper-grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .stagger-item {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .active-scale:active {
      transform: scale(0.96);
    }

    .custom-shadow {
      box-shadow: 0 10px 40px -10px rgba(30, 42, 34, 0.2);
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    @view-transition {
      navigation: auto;
    }
  </style>
  <style>sd-component { display: block; }</style>
  <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
</head>
<body>
  <div class="w-full h-screen bg-[#FAF7F1] relative overflow-hidden font-plus text-[#1E2A22]">
    <div class="paper-grain"></div>

    <!-- Blurred App Background -->
    <div class="absolute inset-0 flex flex-col opacity-30 blur-[6px] pointer-events-none">
      <header class="sticky top-0 shrink-0 pt-14 bg-[#6B7A3F] border-t-[0.5px] border-[#B89968] z-40">
        <div class="h-14 px-6 flex items-center">
          <div class="w-8 h-8 rounded-full bg-white/20"></div>
          <div class="ml-4 h-3 w-24 bg-white/20 rounded-full"></div>
        </div>
      </header>
      <main class="p-6 space-y-6">
        <div class="h-44 bg-white/60 rounded-[32px]"></div>
        <div class="h-44 bg-white/60 rounded-[32px]"></div>
        <div class="h-44 bg-white/60 rounded-[32px]"></div>
      </main>
    </div>

    <!-- Modal Overlay Backdrop -->
    <div class="absolute inset-0 bg-[#1E2A22]/50 backdrop-blur-[2px] z-40 flex items-center justify-center p-5 pb-[100px]">
      
      <!-- Modal Container -->
      <div class="w-full max-w-sm bg-[#FAF7F1] rounded-[48px] shadow-2xl flex flex-col relative stagger-item overflow-hidden" style="max-height: 80vh;">
        
        <!-- Standardized Modal Header -->
        <header class="sticky top-0 shrink-0 pt-14 bg-[#6B7A3F] border-t-[0.5px] border-[#B89968] z-50">
          <div class="h-14 px-4 flex items-center justify-between">
            <div class="w-10 flex items-center justify-start">
              <span class="font-fraunces text-[11px] font-bold text-[#FAF7F1]/60 uppercase tracking-[0.1em]">1/4</span>
            </div>
            <h1 class="font-fraunces text-[20px] font-semibold text-[#FAF7F1] tracking-tight flex-1 text-center">Pick a Crop</h1>
            <div class="w-10 flex items-center justify-end">
              <a href="#" id="modal-close-link" class="w-10 h-10 flex items-center justify-center text-[#FAF7F1] hover:bg-white/10 rounded-full transition-colors active-scale">
                <iconify-icon icon="lucide:x" class="text-2xl"></iconify-icon>
              </a>
            </div>
          </div>
        </header>

        <!-- Scrollable Crop Content -->
        <div class="flex-1 overflow-y-auto px-6 pb-10 scrollbar-hide">
          <div class="grid grid-cols-2 gap-x-4 gap-y-8 mt-4">
            
            <!-- Tomato (Selected) -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 50ms">
              <div class="relative w-[100px] h-[100px] rounded-full border-2 border-[#2E5D3A] p-[3px] cursor-pointer shadow-lg active-scale">
                <div class="w-full h-full rounded-full overflow-hidden">
                  <img src="https://images.unsplash.com/photo-1592841200221-a6898f307baa?auto=format&fit=crop&q=80&w=240" alt="Tomato" class="w-full h-full object-cover">
                </div>
                <div class="absolute inset-0 bg-[#2E5D3A]/20 rounded-full flex items-center justify-center">
                  <div class="w-9 h-9 bg-[#FAF7F1] rounded-full flex items-center justify-center shadow-md">
                    <iconify-icon icon="lucide:check" class="text-[#2E5D3A] text-xl font-bold"></iconify-icon>
                  </div>
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Tomato</span>
            </div>

            <!-- Basil -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 100ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1618375531912-867984d28994?auto=format&fit=crop&q=80&w=240" alt="Basil" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Basil</span>
            </div>

            <!-- Cucumber -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 150ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1449339854873-750e6df51301?auto=format&fit=crop&q=80&w=240" alt="Cucumber" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Cucumber</span>
            </div>

            <!-- Eggplant -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 200ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1615485240384-5423c37ce020?auto=format&fit=crop&q=80&w=240" alt="Eggplant" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Eggplant</span>
            </div>

            <!-- Capsicum -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 250ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1591552554271-91a5e1197825?auto=format&fit=crop&q=80&w=240" alt="Capsicum" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Capsicum</span>
            </div>

            <!-- Lettuce -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 300ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1556801712-76c82013f982?auto=format&fit=crop&q=80&w=240" alt="Lettuce" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Lettuce</span>
            </div>
            
            <!-- Meyer Lemon -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 350ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1621251949434-2e98ba0356c9?auto=format&fit=crop&q=80&w=240" alt="Meyer Lemon" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Lemon</span>
            </div>
            
            <!-- Fig -->
            <div class="flex flex-col items-center gap-3 stagger-item" style="animation-delay: 400ms">
              <div class="w-[100px] h-[100px] rounded-full border border-[#B89968]/20 bg-white p-[3px] cursor-pointer active-scale">
                <div class="w-full h-full rounded-full overflow-hidden grayscale-[20%]">
                  <img src="https://images.unsplash.com/photo-1536485880598-a28d54209930?auto=format&fit=crop&q=80&w=240" alt="Fig" class="w-full h-full object-cover">
                </div>
              </div>
              <span class="font-fraunces font-semibold text-[#1E2A22] text-base">Fig</span>
            </div>

          </div>
        </div>

        <!-- Modal Footer -->
        <div class="p-6 bg-white border-t border-[#B89968]/10">
          <a href="#" id="modal-confirm-btn" class="flex items-center justify-center w-full h-[56px] bg-[#2E5D3A] text-white font-fraunces font-semibold rounded-[24px] shadow-xl active-scale transition-all hover:bg-[#254b2e]">
            Select Crop
          </a>
        </div>
      </div>
    </div>

    <!-- Global Bottom Navigation Bar (Matching Exactly in all views) -->
    <div class="fixed bottom-0 left-0 w-full z-50">
      <!-- component: BottomNavigation (cd8c80f5-74cc-4601-89c1-0e037aa5e3af) -->
<div v-scope="{ ...{&quot;activeItem&quot;:&quot;none&quot;,&quot;homeHref&quot;:&quot;#home&quot;,&quot;cropsHref&quot;:&quot;#crops&quot;,&quot;calendarHref&quot;:&quot;#calendar&quot;,&quot;pestsHref&quot;:&quot;#pests&quot;,&quot;settingsHref&quot;:&quot;#settings&quot;}, $emit() {} }">
<footer class="fixed bottom-0 left-0 right-0 bg-white border-t-[0.5px] border-[#B89968]/30 px-2 pb-[34px] pt-3 z-50" style="box-shadow: 0 2px 4px rgba(46,45,33,0.03), 0 8px 16px rgba(46,45,33,0.06)"><nav class="flex justify-between items-center max-w-md mx-auto"><a :href="homeHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:home" class="text-[18px]" :class="activeItem === 'home' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'home' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Home</span><div v-if="activeItem === 'home'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="cropsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:sprout" class="text-[18px]" :class="activeItem === 'crops' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'crops' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Crops</span><div v-if="activeItem === 'crops'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="calendarHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:calendar" class="text-[18px]" :class="activeItem === 'calendar' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'calendar' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Calendar</span><div v-if="activeItem === 'calendar'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="pestsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:bug" class="text-[18px]" :class="activeItem === 'pests' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'pests' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Pests</span><div v-if="activeItem === 'pests'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a><a :href="settingsHref" class="flex flex-col items-center gap-1 px-4 relative"><iconify-icon icon="lucide:settings" class="text-[18px]" :class="activeItem === 'settings' ? 'text-[#2E5D3A]' : 'text-[#7A7A7A]'"></iconify-icon><span class="text-[10px] font-fraunces" :class="activeItem === 'settings' ? 'font-bold text-[#2E5D3A]' : 'font-medium text-[#7A7A7A]'">Settings</span><div v-if="activeItem === 'settings'" class="absolute -bottom-[2px] left-1/2 -translate-x-1/2 w-1 h-1 bg-[#2E5D3A] rounded-full"></div></a></nav></footer>
</div>
<!-- /component: BottomNavigation (cd8c80f5-74cc-4601-89c1-0e037aa5e3af) -->
    </div>
  </div>
</body>
</html>
