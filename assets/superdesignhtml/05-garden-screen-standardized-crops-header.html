<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>:root { --color-forest: #2E5D3A; --color-olive: #6B7A3F; --color-terracotta: #C06B3A; --color-honey: #E0A458; --color-brass: #B89968; --color-cream: #FAF7F1; --color-ink: #1E2A22; } body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; } .font-fraunces { font-family: 'Fraunces', serif; } .paper-grain { pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); } .warm-shadow { box-shadow: 0 2px 4px rgba(46,45,33,0.06), 0 8px 16px rgba(46,45,33,0.06); } .app-bar {
